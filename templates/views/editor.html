<div class="editor-layout">
    
    <!-- Left: File Explorer -->
    <div class="file-explorer">
        <div class="explorer-header">
            <span><i class="fa-solid fa-folder-tree"></i> EXPLORER</span>
            <div style="display:flex; gap:3px;"><button class="editor-btn" onclick="newFile()" style="padding: 2px 6px;" title="New File"><i class="fa-solid fa-file-circle-plus"></i></button><button class="editor-btn" onclick="createFolder()" style="padding: 2px 6px;" title="New Folder"><i class="fa-solid fa-folder-plus"></i></button><button class="editor-btn error" onclick="deleteFolder()" style="padding: 2px 6px; margin-left:10px;" title="Delete Folder"><i class="fa-solid fa-folder-minus"></i></button></div>
        </div>
        <div id="file-list" class="file-list">
            <div style="color: var(--text-muted); font-size: 12px; text-align: center; margin-top: 20px;">
                <i class="fa-solid fa-spinner fa-spin"></i> Loading files...
            </div>
        </div>
    </div>

    <!-- Center: Code Editor -->
    <div class="editor-main" id="editor-main-container">
        <!-- VS Code Style Tabs -->
        <div class="editor-tabs" id="editor-tabs">
            <!-- Tabs will be dynamically inserted here -->
        </div>

        <div class="editor-toolbar" style="padding: 5px 10px; border-bottom: 1px solid var(--border-color); background: var(--bg-surface);">
            <div style="display: flex; gap: 5px; align-items: center;">
                <span id="current-file-path" style="font-size: 12px; color: var(--text-muted); font-family: var(--font-mono);">No file selected</span>
            </div>
            
            <div style="margin-left: auto; display: flex; gap: 5px; align-items: center;">
                <button class="editor-btn primary" onclick="saveFile()" title="Save File (Ctrl+S)"><i class="fa-solid fa-floppy-disk"></i></button>
                <button class="editor-btn" onclick="renameFile()" title="Rename File"><i class="fa-solid fa-pen-to-square"></i></button>
                <button id="run-btn" class="editor-btn success" onclick="runCode()" style="display: none;" title="Run HTML/JS in browser">
                    <i class="fa-solid fa-play"></i>
                </button>
                <button class="editor-btn ai" onclick="aiEdit()" title="AI Edit">
                    <i class="fa-solid fa-wand-magic-sparkles"></i>
                </button>
            </div>
        </div>
        
        <div class="editor-split-container">
            <!-- Ace Editor -->
            <div id="ace-editor"></div>

            <!-- Output iframe (hidden by default) -->
            <div id="preview-container" style="display: none; flex: 1; border-left: var(--glass-border); background: #ffffff;">
                <div style="background: var(--bg-surface); padding: 5px 10px; border-bottom: var(--glass-border); display: flex; justify-content: space-between; align-items: center;">
                    <span style="font-size: 12px; color: var(--text-secondary);"><i class="fa-brands fa-html5"></i> Live Preview</span>
                    <div style="display:flex; gap:5px;"><button class="editor-btn" onclick="toggleFullScreenPreview()" style="padding: 2px 8px;" title="Toggle Fullscreen"><i id="fullscreen-icon" class="fa-solid fa-expand"></i></button><button class="editor-btn" onclick="closePreview()" style="padding: 2px 8px;" title="Close Preview"><i class="fa-solid fa-xmark"></i></button></div>
                </div>
                <iframe id="live-preview-frame" style="width: 100%; height: calc(100% - 30px); border: none; background: white;"></iframe>
            </div>
        </div>
    </div>

</div>
